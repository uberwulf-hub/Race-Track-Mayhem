# Puts the internet race server (server/relay) online on Cloudflare Workers.
# One-time setup: add a repository secret CLOUDFLARE_API_TOKEN (a Cloudflare API
# token made from the "Edit Cloudflare Workers" template). Then run this from
# Actions > Relay server > Run workflow. It prints the server's address.
name: Relay server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

# Builds the Android version (an .apk you can install on a phone or tablet).
# Runs on its own from Actions > Android > Run workflow (the .apk is kept as a
# download on the run's page), and as part of every Release, which attaches it
# to the GitHub release as RaceTrackMayhem-android.apk.
#
# Signing: Android only installs an update over an older copy if both were
# signed with the same key. Set these repository secrets once to use your own
# permanent key (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   the .keystore file, base64-encoded
#   ANDROID_KEYSTORE_ALIAS    the key's alias
#   ANDROID_KEYSTORE_PASSWORD its password
# Without them, a key is made on the first build and kept in the Actions cache.
name: Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp, like v1.9.0 (leave empty to keep the current one)"
        required: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release:
        description: "Attach the .apk to the GitHub release for this version"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and the Android export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-android-templates

      - name: Install Godot and the Android export templates
        run: |
          set -e
          V="${GODOT_VERSION}-stable"
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot
            curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d ~/godot
            mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          fi
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f "$T/android_release.apk" ]; then
            mkdir -p "$T"
            curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
            unzip -o -j -q /tmp/templates.tpz templates/version.txt templates/android_release.apk templates/android_debug.apk -d "$T"
            rm /tmp/templates.tpz
          fi

      - name: Keep the signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/android-key
          key: android-signing-key-v1

      - name: Set up signing and the Android SDK for Godot
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p ~/android-key
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > ~/android-key/release.keystore
            ALIAS="$KEY_ALIAS"; PASS="$KEY_PASS"
            echo "Using the signing key from the repository secrets."
          else
            ALIAS="racetrackmayhem"; PASS="racetrackmayhem"
            if [ ! -f ~/android-key/release.keystore ]; then
              keytool -genkeypair -v -keystore ~/android-key/release.keystore -alias "$ALIAS" \
                -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
                -dname "CN=Race Track Mayhem, O=uberwulf, C=US"
              echo "::warning::Made a new signing key. Phones with an older copy must uninstall it before installing this one."
            else
              echo "Using the cached signing key."
            fi
          fi
          keytool -genkeypair -keystore ~/android-key/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US" 2>/dev/null || true
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/android-key/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASS"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/android-key/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK: $SDK  Java: $JAVA_HOME"
          ls "$SDK/build-tools" | tail -3
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
              "export/android/android_sdk_path = \"$SDK\"" \
              "export/android/java_sdk_path = \"$JAVA_HOME\"" \
              "export/android/debug_keystore = \"$HOME/android-key/debug.keystore\"" \
              'export/android/debug_keystore_user = "androiddebugkey"' \
              'export/android/debug_keystore_pass = "android"' > ~/.config/godot/$f
          done
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Stamp the version number
        env:
          VERSION: ${{ inputs.version }}
        run: |
          V="${VERSION#v}"
          if [ -z "$V" ]; then
            V=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          fi
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$(( ${MA:-1} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          sed -i "s/^config\/version=.*/config\/version=\"$V\"/" project.godot
          sed -i "s/^version\/name=.*/version\/name=\"$V\"/; s/^version\/code=.*/version\/code=$CODE/" export_presets.cfg
          echo "Version $V (code $CODE)"

      - name: Export the Android app
        run: |
          set -e
          ~/godot/godot --headless --path . --import || true
          mkdir -p build/android
          ~/godot/godot --headless --path . --export-release "Android" build/android/RaceTrackMayhem.apk 2>&1 | tee export.log
          test -s build/android/RaceTrackMayhem.apk
          cp build/android/RaceTrackMayhem.apk build/android/RaceTrackMayhem-android.apk
          ls -la build/android

      - uses: actions/upload-artifact@v4
        with:
          name: RaceTrackMayhem-android
          path: build/android/RaceTrackMayhem-android.apk

      - name: Attach to the release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release upload "$VERSION" build/android/RaceTrackMayhem-android.apk --clobber --repo "$GITHUB_REPOSITORY"

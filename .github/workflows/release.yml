# Builds the Windows version and publishes a GitHub release whenever a version
# tag (like v1.0.1) is pushed. SauceStore picks the release up automatically.
#
#   git tag v1.0.1 && git push origin v1.0.1
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-windows-templates

      - name: Install Godot and the Windows export templates
        run: |
          set -e
          V="${GODOT_VERSION}-stable"
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot
            curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d ~/godot
            mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          fi
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f "$T/windows_release_x86_64.exe" ]; then
            mkdir -p "$T"
            curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
            unzip -o -j -q /tmp/templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe -d "$T"
            rm /tmp/templates.tpz
          fi

      - name: Export the game
        run: |
          set -e
          ~/godot/godot --headless --path . --import || true
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/RaceTrackMayhem.exe
          test -s build/windows/RaceTrackMayhem.exe

      - name: Zip it up
        run: |
          set -e
          mkdir -p dist/zip/licenses
          cp build/windows/RaceTrackMayhem.exe dist/zip/
          cp licenses/* dist/zip/licenses/
          cp assets/audio/CREDITS.md dist/zip/licenses/AUDIO-CREDITS.md
          (cd dist/zip && zip -r -9 ../RaceTrackMayhem-windows.zip .)
          ls -la dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/RaceTrackMayhem-windows.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Race Track Mayhem $GITHUB_REF_NAME" \
            --generate-notes

# Cloudflare Workers settings for the race relay. Deploy with:  npx wrangler deploy
name = "race-track-mayhem-relay"
main = "worker.mjs"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RaceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaceRoom"]

# Cloudflare Workers settings for the race relay. Deploy with:  npx wrangler deploy
name = "race-track-mayhem-relay"
main = "worker.mjs"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RaceRoom"

[[durable_objects.bindings]]
name = "TRACKS"
class_name = "TrackShelf"

[[durable_objects.bindings]]
name = "TIMES"
class_name = "TimesBoard"

[[durable_objects.bindings]]
name = "FRIENDS"
class_name = "FriendHub"

[[durable_objects.bindings]]
name = "GHOSTS"
class_name = "GhostShelf"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaceRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TrackShelf"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["TimesBoard"]

[[migrations]]
tag = "v4"
deleted_classes = ["Vault"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["FriendHub"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["GhostShelf"]
